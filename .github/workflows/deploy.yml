name: Deploy Jekyll site

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build site
        run: bundle exec jekyll build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          timeout: 1200000
      - name: Bark 发布成功通知
        if: success()
        run: |
          curl -s "https://api.day.app/PWhxDvCuLGMofA5cr8YuaY/89ao.github.io%E5%8F%91%E5%B8%83%E6%88%90%E5%8A%9F?url=https://motorao.cn"
      - name: Bark 构建失败通知
        if: failure()
        run: |
          curl -s "https://api.day.app/PWhxDvCuLGMofA5cr8YuaY/89ao.github.io%E6%9E%84%E5%BB%BA%E5%A4%B1%E8%B4%A5?url=https://motorao.cn"
